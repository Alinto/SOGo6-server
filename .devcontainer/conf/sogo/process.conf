# SOGo process configuration file
# Format: KEY=value (one per line)
# Lines starting with # are comments
#
# Variables defined here are loaded AFTER environment variables from docker-compose.yml.
# Priority order:
#   1. Environment variables (docker-compose `environment:` section or host env)
#   2. This file (/etc/sogo/process.conf)
#   3. Default values defined in ProcessSetting.py

# --- Admin ---
# SOGO_P_ADMIN=admin
# SOGO_P_ADMIN_PWD=admin

# --- Redis ---
# SOGO_P_REDIS_URL=redis://sogo:sogo@redis:6379
# SOGO_P_REDIS_RESP_3=true

# --- Secrets ---
# SOGO_P_VOUCHER_SECRET=your-32-char-fernet-key-here
# SOGO_AES_ENC_KEY=your-32-bytes-aes-key-here

# --- Database ---
# SOGO_P_DB_TYPE=PostgreSQL
# SOGO_P_DB_USER=sogo
# SOGO_P_DB_PASS=sogo
# SOGO_P_DB_HOST=postgresql
# SOGO_P_DB_PORT=5432
# SOGO_P_DB_SSL=false
# SOGO_P_DB_ENC=utf8
