[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "SOGo"
description = "SOGo 6 backend API server"
authors = [
    {name = "Quentin Hivert", email = "quentin.hivert.fr@gmail.com"},
]
license = { text = "GPL-3.0-or-later" }
dynamic = [ "version" ]
requires-python = ">=3.13,<4.0"
keywords = ["sogo", "webmail", "mail", "calendar"]
dependencies = [
    "celery==5.6.3",
    "click==8.4.2",
    "cryptography==49.0.0",
    "flask==3.1.3",
    "flask-compress==1.24",
    "flask-cors==6.0.5",
    "flask-smorest==0.47.0",
    "gunicorn==26.0.0",
    "icalendar==7.2.0",
    "marshmallow==4.3.0",
    "mysql-connector-python==9.7.0",
    "psycopg==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyjwt==2.13.0",
    "python-ldap==3.4.7",
    "pytest-mock==3.15.1",
    "redis==8.0.1",
    "sievelib==1.5.0",
    "types-smorest==1.1.2",
    "yarl==1.24.2",
]


[tool.poetry]
version = "6.0.alpha"  # base version
packages = [
    { include = "app" },
]
package-mode = false

